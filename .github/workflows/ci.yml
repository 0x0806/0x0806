name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", "README.md", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: README markers are balanced
        run: |
          for s in featured stats activity updated; do
            grep -q "<!--START_SECTION:$s-->" README.md && grep -q "<!--END_SECTION:$s-->" README.md || { echo "missing marker: $s"; exit 1; }
          done
