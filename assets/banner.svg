<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="0x0806 - Senior Cybersecurity Specialist">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#12304a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#2E86C1"/><stop offset="1" stop-color="#58d6ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2E86C1" stroke-opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1000" height="220" rx="14" fill="url(#bg)"/>
  <rect width="1000" height="220" rx="14" fill="url(#grid)"/>
  <rect x="0" y="0" width="1000" height="3" fill="url(#accent)">
    <animate attributeName="opacity" values=".3;1;.3" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="500" y="108" text-anchor="middle" font-family="Hack, 'Fira Code', Consolas, monospace" font-size="64" font-weight="700" fill="url(#accent)">0x0806</text>
  <text x="500" y="148" text-anchor="middle" font-family="Hack, 'Fira Code', Consolas, monospace" font-size="20" fill="#c9d1d9">Senior Cybersecurity Specialist</text>
  <text x="500" y="182" text-anchor="middle" font-family="Hack, 'Fira Code', Consolas, monospace" font-size="14" fill="#8b949e">$ red-team · pentest · vuln-research<tspan fill="#58d6ff"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>_</tspan></text>
</svg>
